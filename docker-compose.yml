# Plataforma completa para rodar localmente: os dois serviços, cada um com o seu banco.
# Requer o repositório vehicle-sales-service clonado ao lado deste (../vehicle-sales-service).
services:
  core-db:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: core_db
      POSTGRES_USER: core
      POSTGRES_PASSWORD: core
    ports:
      - "15432:5432"
    volumes:
      - core-db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U core -d core_db"]
      interval: 5s
      retries: 10

  core-service:
    build: .
    depends_on:
      core-db:
        condition: service_healthy
      sales-service:
        condition: service_healthy
    environment:
      DB_URL: jdbc:postgresql://core-db:5432/core_db
      DB_USERNAME: core
      DB_PASSWORD: core
      SALES_SERVICE_URL: http://sales-service:8080
      SALES_INTERNAL_TOKEN: ${INTERNAL_API_TOKEN:-local-internal-token}
    ports:
      - "8081:8080"
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:8080/actuator/health/readiness || exit 1"]
      interval: 5s
      retries: 30

  sales-db:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: sales_db
      POSTGRES_USER: sales
      POSTGRES_PASSWORD: sales
    ports:
      - "15433:5432"
    volumes:
      - sales-db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U sales -d sales_db"]
      interval: 5s
      retries: 10

  sales-service:
    build: ../vehicle-sales-service
    depends_on:
      sales-db:
        condition: service_healthy
    environment:
      DB_URL: jdbc:postgresql://sales-db:5432/sales_db
      DB_USERNAME: sales
      DB_PASSWORD: sales
      INTERNAL_API_TOKEN: ${INTERNAL_API_TOKEN:-local-internal-token}
      WEBHOOK_SECRET: ${WEBHOOK_SECRET:-local-webhook-secret}
    ports:
      - "8082:8080"
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:8080/actuator/health/readiness || exit 1"]
      interval: 5s
      retries: 30

volumes:
  core-db-data:
  sales-db-data:
